<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Androidアプリメーカー</title>
<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;background:#111;color:#eee;line-height:1.6}textarea{width:100%;box-sizing:border-box;min-height:8rem;font-size:1.1rem;padding:.8rem;border-radius:.5rem}button,.button{display:inline-block;font-size:1.1rem;padding:.8rem 1.2rem;margin:.5rem .3rem .5rem 0;border:0;border-radius:.5rem;background:#eee;color:#111;text-decoration:none;cursor:pointer}.primary{font-weight:700;background:#ffd166}#next{display:none}#status{white-space:pre-wrap;margin-top:1rem}a{color:#9cf}</style>
<main id="welcome"><h1>🎉 電卓ができました！</h1><p>まず、いま作った電卓をインストールしてみましょう。</p><a class="button primary" href="/apk" download="calculator.apk">電卓をインストール</a><p>インストールできたら電卓を開いて、実際に計算してみてください。</p><p>123 × 456 = 56088 になれば成功です。</p><button type="button" id="installed">インストールできました → 次へ</button></main>
<section id="next"><h2>次は何を作りますか？</h2><p id="mode">準備中…</p><button type="button" data-p="税込10%ボタン付き電卓">税込10%ボタンを付ける</button><button type="button" data-p="計算履歴を付ける">計算履歴を付ける</button><button type="button" data-p="買い物メモ">買い物メモ</button><form id="form"><textarea id="prompt" maxlength="4000" placeholder="自由入力、貼り付け、Gboard音声入力が使えます"></textarea><br><button>アプリを作る</button></form><div id="status"></div></section>
<script>const p=document.querySelector('#prompt'),s=document.querySelector('#status'),m=document.querySelector('#mode'),b=document.querySelector('#form button');let csrf='',ai='unavailable';document.querySelector('#installed').onclick=()=>{document.querySelector('#welcome').style.display='none';document.querySelector('#next').style.display='block';(async()=>{try{let j=await(await fetch('/api/status')).json();csrf=j.csrf;ai=j.ai;m.textContent=ai==='available'?'AIアプリ生成：利用可能':ai==='login_required'?'AIアプリ生成を使うにはOpenAI Codexのログインが必要です':'AIアプリ生成を使うにはOpenAI Codexのログインが必要です';}catch(e){m.textContent='準備に失敗しました。TermuxのWeb UIを再起動してください。'}})()};document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>p.value=x.dataset.p);document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(ai!=='available'){s.textContent='AIアプリ生成を使うにはOpenAI Codexのログインが必要です';return}if(!p.value.trim()||!csrf){s.textContent='準備中です…';return}b.disabled=true;s.textContent='生成・ビルド中です…';try{let j=await(await fetch('/build',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,'Origin':location.origin},body:JSON.stringify({prompt:p.value})})).json();s.textContent=j.message}catch(x){s.textContent='失敗しました。Termuxのログを確認してください。'}finally{b.disabled=false}};</script></html>
