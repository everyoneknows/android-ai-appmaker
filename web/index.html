<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Androidアプリメーカー</title>
<style>body{font-family:system-ui,sans-serif;max-width: fortyrem;max-width:40rem;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}textarea{width:100%;box-sizing:border-box;min-height:8rem;font-size:1.1rem;padding:.8rem;border-radius:.5rem}button{font-size:1.1rem;padding:.8rem 1.2rem;margin:.6rem .3rem .6rem 0;border:0;border-radius:.5rem;background:#eee;color:#111}#status{white-space:pre-wrap;margin-top:1rem}a{color:#9cf}</style>
<h1>どんなアプリを作りますか？</h1>
<p id="mode">AIモード：確認中…</p><p>例文を選ぶか、自由に入力してください。Gboardの音声入力も使えます。</p>
<button type="button" id="example">ストップウォッチ機能付きの時計</button>
<form id="form"><textarea id="prompt" placeholder="作りたいアプリの仕様を入力"></textarea><br><button>アプリを作る</button></form>
<div id="status"></div>
<script>const p=document.querySelector('#prompt'),s=document.querySelector('#status'),m=document.querySelector('#mode'),b=document.querySelector('form button');let csrf='',ai='unavailable';(async()=>{try{const j=await (await fetch('/api/status')).json();csrf=j.csrf;ai=j.ai;m.textContent=ai==='available'?'AIモード：利用可能':ai==='login_required'?'AIモード：ログインが必要':'AIモード：利用不可。サンプルアプリのみ生成できます';}catch(e){m.textContent='AIモード：利用不可。サンプルアプリのみ生成できます';}})();document.querySelector('#example').onclick=()=>p.value='ストップウォッチ機能付きの時計';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(!p.value.trim()||!csrf){s.textContent='準備中です…';return}if(ai!=='available'&&p.value.trim()!=='ストップウォッチ機能付きの時計'){s.textContent='AIモードが利用できないため、例文のデモのみ生成できます。';return}b.disabled=true;s.textContent='生成・ビルド中です…';try{const r=await fetch('/build',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({prompt:p.value})});const j=await r.json();s.textContent=j.message+(j.apk?'\nAPKを開きます…':'');if(j.apk)location.href='/install'}catch(x){s.textContent='失敗しました: '+x}finally{b.disabled=false}};</script>
</html>
